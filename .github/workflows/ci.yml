name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  HF_HOME: ${{ github.workspace }}/.hf-cache
  BI_ENCODER: paraphrase-multilingual-MiniLM-L12-v2

jobs:
  # ── 1. Lint + unit/API tests + import smoke ─────────────────────────────────
  backend:
    name: Backend (ruff + pytest + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — blocking)
        run: ruff check .

      - name: Import smoke
        run: python -c "import main; print('import ok:', main.app.title, main.app.version)"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.BI_ENCODER }}-v1

      - name: Unit + API tests (pytest, coverage floor 80%)
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

      - name: Matcher smoke (synthetic 32-case set — a tripwire, NOT a quality gate; ADR-0017)
        run: python scripts/eval_matcher.py

  # ── 2. Production image builds and answers /health/ready ───────────────────
  docker:
    name: Docker (build + readiness smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: prism-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and wait for readiness
        run: |
          docker run -d --name prism -p 8000:8000 -e PRISM_ALLOWED_ORIGINS=http://localhost prism-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then echo "ready after ${i}s"; break; fi
            sleep 2
            if [ "$i" = "60" ]; then echo "container never became ready"; docker logs prism; exit 1; fi
          done
          curl -fsS http://127.0.0.1:8000/health | python3 -m json.tool
          docker exec prism sh -c 'id -u' | grep -qv '^0$' && echo "runs as non-root"
      - name: Image size
        run: docker image inspect prism-backend:ci --format 'size={{.Size}} bytes' | awk -F= '{printf "image size: %.0f MB\n", $2/1048576}'

  # ── 3. Browser end-to-end against the real backend + static frontend ───────
  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.BI_ENCODER }}-v1

      - name: Start backend + frontend
        run: |
          (cd backend && PRISM_ENV=test PRISM_RATE_LIMIT_SUBMISSIONS=0 PRISM_WARMUP_MODELS=true \
             nohup uvicorn main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && nohup python _serve.py 3000 > ../frontend.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1 && break
            sleep 2
            if [ "$i" = "90" ]; then echo "backend never became ready"; cat backend.log; exit 1; fi
          done
          echo "backend ready"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E specs (offline set)
        working-directory: e2e
        run: node run.mjs

      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/shots/
            backend.log
            frontend.log
          if-no-files-found: ignore

  # ── 4. Public-dataset benchmark gate (the real quality gate; ADR-0017/0020) ─
  benchmark:
    name: Benchmark gate (STS-B · MRPC · QQP)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt datasets

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.BI_ENCODER }}-v1

      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: backend/eval/data
          key: eval-data-stsb-mrpc-qqp3000-v1

      - name: Fetch public paraphrase sets (validation splits; QQP sampled to 3000)
        run: |
          [ -f eval/data/stsb/pairs.jsonl ] || python -m eval.fetch_datasets stsb mrpc
          [ -f eval/data/qqp/pairs.jsonl ]  || python -m eval.fetch_datasets qqp --limit 3000

      - name: Run the benchmark with gates
        run: python -m eval.run_pairs stsb mrpc qqp --gate

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: backend/eval/results/*.json

  # ── 5. Frontend syntax ─────────────────────────────────────────────────────
  frontend:
    name: Frontend (JS syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all JS
        run: |
          for f in frontend/js/*.js e2e/*.mjs; do node --check "$f" && echo "ok  $f"; done
