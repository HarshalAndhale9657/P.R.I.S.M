name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (import + offline smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Download NLP models
        run: |
          python -m spacy download en_core_web_sm
          python -m nltk.downloader punkt punkt_tab

      - name: Lint (advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . || true

      - name: Import smoke (fails the build if the app can't import)
        run: python -c "import main; print('import ok:', main.app.title)"

      - name: Offline pipeline smoke test
        run: python _smoketest.py

      - name: Originality matcher smoke test
        run: python _smoketest_check.py

      - name: Matcher evaluation (precision/recall + false-positive-rate gate)
        run: python scripts/eval_matcher.py

      - name: Unit + API tests (pytest + FastAPI TestClient)
        run: |
          pip install -r requirements-dev.txt
          pytest

  frontend:
    name: Frontend (JS syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all JS
        run: |
          for f in js/*.js; do node --check "$f" && echo "ok  $f"; done
