name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install -U pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint (ruff — blocking)
        run: ruff check .

      - name: Import smoke (fails the build if the app can't import)
        run: python -c "import main; print('import ok:', main.app.title, main.app.version)"

      - name: Unit + API tests (pytest, with coverage)
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

      - name: Matcher smoke (synthetic 32-case set — a tripwire, NOT a quality gate; see ADR-0017)
        run: python scripts/eval_matcher.py

  frontend:
    name: Frontend (JS syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all JS
        run: |
          for f in js/*.js; do node --check "$f" && echo "ok  $f"; done
